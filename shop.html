<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop | G2 Clothing &amp; Homeware</title>
  <meta name="description" content="Shop G2 clothing, footwear and accessories for mens, ladies, boys and girls. Prices from R15.">
  <meta name="theme-color" content="#eb1918">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="shop">
  <div id="site-header"></div>
  <main>
    <div class="page-hero"><div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a> / Shop</div>
      <h1 id="shop-title">All Products</h1>
      <p>Branded items for less, in store now. Tap "Order" to check stock on WhatsApp.</p>
    </div></div>
    <section>
      <div class="container shop-layout">
        <aside class="filters" aria-label="Filters">
          <h3>Category</h3>
          <ul class="filter-list" id="filter-cats"></ul>
          <h3><label for="sort">Sort by</label></h3>
          <select id="sort">
            <option value="featured">Featured</option>
            <option value="low">Price: low to high</option>
            <option value="high">Price: high to low</option>
          </select>
        </aside>
        <div>
          <div class="shop-toolbar"><span class="result-count" id="result-count" aria-live="polite"></span></div>
          <div class="product-grid" id="shop-grid"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
